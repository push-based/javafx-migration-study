<section class="weather-stream">
  <h1>My Weather Forecast</h1>

  <p class="forecast" aria-live="polite" data-testid="forecast">
    @if (forecast(); as current) {
      {{ current }}
    }
  </p>

  @if (error(); as message) {
    <p class="error" role="alert" data-testid="stream-error">{{ message }}</p>
  }

  <a class="nav" routerLink="latest" data-testid="to-snapshot"
    >Get Current Forecast</a
  >
</section>
